{% extends "base.html" %}

{% block title %}后台登录 - 我的 Flask 博客{% endblock %}

{% block content %}
    <div class="login-box">
        <h1 style="text-align:center;margin-bottom:30px;">后台登录</h1>
        <form method="POST">
            <label>账号</label>
            <input type="text" name="username" placeholder="admin" required>
            
            <label>密码</label>
            <input type="password" name="password" placeholder="mima" required>
            
            <button type="submit" style="width:100%;">登录</button>
        </form>
    </div>
{% endblock %}
